# Copy this file to application-local.properties for local development.
# Keep application-local.properties untracked.
# Generate a local secret with: openssl rand -base64 64
app.jwt.secret=replace-with-a-local-dev-secret-at-least-32-characters-long

# Defaults shown for clarity. Values are milliseconds.
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000
