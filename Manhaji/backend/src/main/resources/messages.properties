# User-facing error messages. Arabic is primary app language for students/parents;
# English keys are used for staff-oriented (teacher/admin) errors where i18n isn't
# shipping in the demo.

# Auth
error.auth.emailAlreadyRegistered=Email already registered
error.auth.phoneAlreadyRegistered=Phone number already registered
error.auth.emailOrPhoneRequired=Email or phone number is required
error.auth.invalidEmailCredentials=البريد الإلكتروني أو كلمة المرور غير صحيحة
error.auth.invalidPhoneCredentials=رقم الهاتف أو كلمة المرور غير صحيح
error.auth.invalidRefreshToken=Invalid or expired refresh token
error.auth.invalidRole=Invalid role: {0}
# Audit-4 fix H1 (2026-05-15): used when a disabled account attempts login or refresh.
error.auth.accountDisabled=تم تعطيل هذا الحساب. تواصل مع مشرف المدرسة.
# Change-password (2026-07-07): student/parent-facing, Arabic. "كلمة المرور الحالية غير صحيحة"
error.auth.wrongCurrentPassword=كلمة المرور الحالية غير صحيحة
# Audit-4 fix C2 (2026-05-15): question doesn't belong to the attempt's quiz.
error.attempt.questionNotInQuiz=This question does not belong to your current quiz
# Audit-4 fix C3 (2026-05-15): client-supplied tracing score outside valid range.
error.tracing.scoreOutOfRange=Tracing score must be between 0 and 100, stars 0..3
# Audit-4 fix H8 (2026-05-15): concurrent startAttempt requests.
error.attempt.alreadyInProgress=An in-progress attempt for this quiz already exists

