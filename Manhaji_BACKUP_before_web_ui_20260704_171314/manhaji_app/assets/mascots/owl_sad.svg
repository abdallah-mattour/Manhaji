<?xml version="1.0" encoding="UTF-8"?>
<!-- Hakeem the owl — sad pose (drooped wings, single tear, downturned mouth). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <ellipse cx="120" cy="220" rx="56" ry="6" fill="#1A1F36" opacity="0.10"/>

  <path d="M70 60 Q72 30 92 50 Q88 60 80 70 Z" fill="#1976D2"/>
  <path d="M170 60 Q168 30 148 50 Q152 60 160 70 Z" fill="#1976D2"/>

  <!-- body slightly hunched (lower than usual) -->
  <ellipse cx="120" cy="124" rx="76" ry="84" fill="#2196F3"/>
  <path d="M60 84 Q120 36 180 84 Q150 64 120 64 Q90 64 60 84 Z" fill="#42A5F5" opacity="0.65"/>
  <ellipse cx="120" cy="154" rx="46" ry="48" fill="#E3F2FD"/>

  <path d="M100 144 Q120 156 140 144" stroke="#BBDEFB" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M96 162 Q120 176 144 162" stroke="#BBDEFB" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- wings drooped low -->
  <path d="M44 130 Q30 180 60 196 Q72 184 70 158 Q66 138 44 130 Z" fill="#1976D2"/>
  <path d="M196 130 Q210 180 180 196 Q168 184 170 158 Q174 138 196 130 Z" fill="#1976D2"/>

  <!-- eyes: looking down, droopy -->
  <circle cx="90" cy="108" r="28" fill="#FFFFFF"/>
  <circle cx="150" cy="108" r="28" fill="#FFFFFF"/>
  <circle cx="90" cy="108" r="28" fill="none" stroke="#BBDEFB" stroke-width="1.5"/>
  <circle cx="150" cy="108" r="28" fill="none" stroke="#BBDEFB" stroke-width="1.5"/>
  <!-- droopy upper lids hiding part of the eyes -->
  <path d="M62 108 Q90 92 118 108 L118 88 L62 88 Z" fill="#2196F3"/>
  <path d="M122 108 Q150 92 178 108 L178 88 L122 88 Z" fill="#2196F3"/>

  <circle cx="92" cy="116" r="10" fill="#2D3436"/>
  <circle cx="148" cy="116" r="10" fill="#2D3436"/>
  <circle cx="94" cy="114" r="3" fill="#FFFFFF"/>
  <circle cx="150" cy="114" r="3" fill="#FFFFFF"/>

  <!-- single tear under left eye -->
  <path d="M82 138 Q78 144 80 150 Q86 150 86 144 Q84 138 82 138 Z" fill="#64B5F6"/>
  <circle cx="82" cy="146" r="1.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- beak -->
  <path d="M120 136 L110 148 L130 148 Z" fill="#FFC107"/>
  <path d="M120 136 L110 148 L130 148 Z" fill="none" stroke="#D97706" stroke-width="1"/>

  <!-- downturned mouth -->
  <path d="M104 168 Q120 158 136 168" stroke="#2D3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- feet -->
  <path d="M98 204 L92 216 M98 204 L100 217 M98 204 L106 215" stroke="#FFC107" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M142 204 L136 216 M142 204 L140 217 M142 204 L148 215" stroke="#FFC107" stroke-width="3.5" stroke-linecap="round"/>
</svg>
